name: Auto Save EOD Data

on:
  schedule:
    # 08:45 UTC tương đương với 15:45 giờ Việt Nam (UTC + 7)
    # Chạy vào các ngày từ Thứ 2 đến Thứ 6 hàng tuần
    - cron: '45 8 * * 1-5'
  workflow_dispatch: # Tính năng này cho phép bạn bấm nút chạy thử thủ công khi cần

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install vnstock3 squarify supabase pandas

    - name: Run python script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python save_eod.py
